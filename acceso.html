  <header class="home-header"><span class="home-mark">CR</span><span>CONGRESS RENTAL</span></header>
  <main class="login-main">
    <h1>Entrar a la app</h1>
    <form id="login-form">
      <fieldset class="login-modes"><legend>Tipo de acceso</legend><label><input type="radio" name="access-kind" value="full" checked>Administrador</label><label><input type="radio" name="access-kind" value="calendar">Consultar calendarios y planillas</label></fieldset>
      <label class="login-field">Contraseña<div class="password-field"><input id="access-password" type="password" autocomplete="current-password" required><button type="button" id="toggle-password" aria-pressed="false">Mostrar</button></div></label>
      <button class="login-submit" id="login-submit" type="submit">Entrar</button>
      <p id="login-error" role="alert" hidden></p>
    </form>
  </main>
